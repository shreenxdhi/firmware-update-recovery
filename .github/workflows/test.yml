name: Update and recovery tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make python3
      - name: Build and verify
        run: make test
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-engine-results
          path: |
            build/integration-results.json
            build/sanitizer-results.json
